name: languon-edge

services:
    nginx:
        container_name: ${DEPLOY_PROJECT_PREFIX:?required}-edge-nginx
        image: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
        restart: unless-stopped
        init: true
        command: ['/bin/sh', '/etc/nginx/languon-edge-entrypoint.sh']
        stop_grace_period: 310s
        ports:
            - ${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${PUBLIC_HTTP_PORT:-80}:8080
            - ${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${PUBLIC_HTTPS_PORT:-443}:8443
            - ${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT:-8444}:8444
        volumes:
            - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ${DEPLOY_RUNTIME_DIR:?required}:/etc/nginx/languon:ro
            - ${TLS_CERTIFICATE_PATH:?required}:/etc/nginx/tls/tls.crt:ro
            - ${TLS_PRIVATE_KEY_PATH:?required}:/etc/nginx/tls/tls.key:ro
            - ${ADMIN_HTPASSWD_PATH:?required}:/run/secrets/languon-admin-htpasswd:ro
            - ../../nginx/edge-entrypoint.sh:/etc/nginx/languon-edge-entrypoint.sh:ro
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--quiet',
                    '--spider',
                    'http://127.0.0.1:8080/edge-healthz',
                ]
            interval: 5s
            timeout: 3s
            retries: 20
        networks:
            - edge
        security_opt:
            - no-new-privileges:true
        read_only: true
        tmpfs:
            - /etc/nginx/admin:size=64k,mode=0750
            - /var/cache/nginx:size=64m,mode=0755
            - /var/run:size=4m,mode=0755
            - /tmp:size=16m,mode=1777

networks:
    edge:
        external: true
        name: ${DEPLOY_PROJECT_PREFIX:?required}-edge
    data:
        external: true
        name: ${DEPLOY_PROJECT_PREFIX:?required}-data
