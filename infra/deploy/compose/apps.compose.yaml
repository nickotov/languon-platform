name: languon-app-slot

x-app-defaults: &app-defaults
    restart: unless-stopped
    init: true
    stop_grace_period: 300s
    networks:
        - edge
        - data
    security_opt:
        - no-new-privileges:true
    read_only: true
    tmpfs:
        - /tmp:size=64m,mode=1777

x-worker-defaults: &worker-defaults
    restart: unless-stopped
    init: true
    stop_grace_period: 300s
    networks:
        - data
    security_opt:
        - no-new-privileges:true
    read_only: true
    tmpfs:
        - /tmp:size=64m,mode=1777

services:
    backend:
        <<: *app-defaults
        image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable digest reference}
        environment:
            APP_ENV: ${APP_ENV:?required}
            ADMIN_BASE_URL: ${ADMIN_BASE_URL:?required}
            AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?required}
            AUTH_CODE_HMAC_SECRET: ${AUTH_CODE_HMAC_SECRET:?required}
            AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?required}
            DICTIONARY_HMAC_SECRET: ${DICTIONARY_HMAC_SECRET:?required}
            AUTH_TRUST_PROXY: 'true'
            AUTH_TRUSTED_PROXY_CIDRS: ${EDGE_SUBNET:?required}
            AUTH_WEBAUTHN_RP_ID: ${AUTH_WEBAUTHN_RP_ID:?required}
            BACKEND_HOST: 0.0.0.0
            BACKEND_PORT: 4000
            DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
            DATABASE_URL: ${DATABASE_URL:?required}
            ACCOUNT_DELETION_JOURNAL_BUCKET: ${ACCOUNT_DELETION_JOURNAL_BUCKET:?required}
            ACCOUNT_DELETION_JOURNAL_PREFIX: ${ACCOUNT_DELETION_JOURNAL_PREFIX:?required}
            ACCOUNT_DELETION_JOURNAL_NAMESPACE: ${ACCOUNT_DELETION_JOURNAL_NAMESPACE:?required}
            ACCOUNT_DELETION_JOURNAL_REGION: ${ACCOUNT_DELETION_JOURNAL_REGION:?required}
            ACCOUNT_DELETION_JOURNAL_ENDPOINT: ${ACCOUNT_DELETION_JOURNAL_ENDPOINT:-}
            ACCOUNT_DELETION_JOURNAL_FORCE_PATH_STYLE: ${ACCOUNT_DELETION_JOURNAL_FORCE_PATH_STYLE:-false}
            ACCOUNT_DELETION_JOURNAL_ENCRYPTION_KEY_BASE64: ${ACCOUNT_DELETION_JOURNAL_ENCRYPTION_KEY_BASE64:?required}
            ACCOUNT_DELETION_JOURNAL_ACCESS_KEY_ID: ${ACCOUNT_DELETION_JOURNAL_WRITER_ACCESS_KEY_ID:?required}
            ACCOUNT_DELETION_JOURNAL_SECRET_ACCESS_KEY: ${ACCOUNT_DELETION_JOURNAL_WRITER_SECRET_ACCESS_KEY:?required}
            REDIS_URL: ${REDIS_URL:?required}
            RELEASE_SHA: ${RELEASE_SHA:?required}
            SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-295000}
            DICTIONARY_JOB_API_READABLE_FORMATS: ${DICTIONARY_JOB_API_READABLE_FORMATS:-}
            DICTIONARY_JOB_API_CANCELLABLE_FORMATS: ${DICTIONARY_JOB_API_CANCELLABLE_FORMATS:-}
            DICTIONARY_JOB_API_DISCARDABLE_FORMATS: ${DICTIONARY_JOB_API_DISCARDABLE_FORMATS:-}
            DICTIONARY_JOB_API_ACCEPTABLE_FORMATS: ${DICTIONARY_JOB_API_ACCEPTABLE_FORMATS:-}
            DICTIONARY_JOB_API_ENQUEUED_FORMATS: ${DICTIONARY_JOB_API_ENQUEUED_FORMATS:-}
            DICTIONARY_GENERATION_MAX_INPUT_TOKENS: ${DICTIONARY_GENERATION_MAX_INPUT_TOKENS:-}
            DICTIONARY_GENERATION_MAX_OUTPUT_TOKENS: ${DICTIONARY_GENERATION_MAX_OUTPUT_TOKENS:-}
            DICTIONARY_GENERATION_INPUT_COST_MICROS_PER_MILLION_TOKENS: ${DICTIONARY_GENERATION_INPUT_COST_MICROS_PER_MILLION_TOKENS:-}
            DICTIONARY_GENERATION_OUTPUT_COST_MICROS_PER_MILLION_TOKENS: ${DICTIONARY_GENERATION_OUTPUT_COST_MICROS_PER_MILLION_TOKENS:-}
            DICTIONARY_GENERATION_MAX_COST_MICROS_PER_ATTEMPT: ${DICTIONARY_GENERATION_MAX_COST_MICROS_PER_ATTEMPT:-}
            DICTIONARY_DOCUMENT_OCR_MODE: ${DICTIONARY_DOCUMENT_OCR_MODE:-unavailable}
            DICTIONARY_DOCUMENT_STORAGE_MODE: ${DICTIONARY_DOCUMENT_STORAGE_MODE:-unavailable}
            DICTIONARY_DOCUMENT_STORAGE_ENDPOINT: ${DICTIONARY_DOCUMENT_STORAGE_ENDPOINT:-}
            DICTIONARY_DOCUMENT_STORAGE_REGION: ${DICTIONARY_DOCUMENT_STORAGE_REGION:-}
            DICTIONARY_DOCUMENT_STORAGE_BUCKET: ${DICTIONARY_DOCUMENT_STORAGE_BUCKET:-}
            DICTIONARY_DOCUMENT_STORAGE_FORCE_PATH_STYLE: ${DICTIONARY_DOCUMENT_STORAGE_FORCE_PATH_STYLE:-false}
            DICTIONARY_DOCUMENT_STORAGE_API_ACCESS_KEY_ID: ${DICTIONARY_DOCUMENT_STORAGE_API_ACCESS_KEY_ID:-}
            DICTIONARY_DOCUMENT_STORAGE_API_SECRET_ACCESS_KEY: ${DICTIONARY_DOCUMENT_STORAGE_API_SECRET_ACCESS_KEY:-}
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:4000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
                ]
            interval: 5s
            timeout: 3s
            retries: 24
            start_period: 10s
        networks:
            edge:
                aliases:
                    - ${DEPLOY_SLOT:?required}-backend
            data: {}

    dictionary-worker:
        <<: *worker-defaults
        image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable digest reference}
        command:
            [
                'node',
                'dist/infrastructure/worker/dictionary-worker-command.js',
                'run',
            ]
        environment:
            APP_ENV: ${APP_ENV:?required}
            DATABASE_MAX_CONNECTIONS: ${DICTIONARY_WORKER_DATABASE_MAX_CONNECTIONS:-4}
            DICTIONARY_WORKER_DATABASE_URL: ${DICTIONARY_WORKER_DATABASE_URL:?required}
            DICTIONARY_GENERATION_MODEL_API_KEY: ${DICTIONARY_GENERATION_MODEL_API_KEY:-}
            DICTIONARY_GENERATION_MODEL_BASE_URL: ${DICTIONARY_GENERATION_MODEL_BASE_URL:-}
            DICTIONARY_GENERATION_MODEL_ID: ${DICTIONARY_GENERATION_MODEL_ID:-}
            DICTIONARY_GENERATION_PROVIDER_MODE: ${DICTIONARY_GENERATION_PROVIDER_MODE:-unavailable}
            DICTIONARY_GENERATION_MAX_INPUT_TOKENS: ${DICTIONARY_GENERATION_MAX_INPUT_TOKENS:-}
            DICTIONARY_GENERATION_MAX_OUTPUT_TOKENS: ${DICTIONARY_GENERATION_MAX_OUTPUT_TOKENS:-}
            DICTIONARY_GENERATION_INPUT_COST_MICROS_PER_MILLION_TOKENS: ${DICTIONARY_GENERATION_INPUT_COST_MICROS_PER_MILLION_TOKENS:-}
            DICTIONARY_GENERATION_OUTPUT_COST_MICROS_PER_MILLION_TOKENS: ${DICTIONARY_GENERATION_OUTPUT_COST_MICROS_PER_MILLION_TOKENS:-}
            DICTIONARY_GENERATION_MAX_COST_MICROS_PER_ATTEMPT: ${DICTIONARY_GENERATION_MAX_COST_MICROS_PER_ATTEMPT:-}
            DICTIONARY_DOCUMENT_FINGERPRINT_HMAC_SECRET: ${DICTIONARY_DOCUMENT_FINGERPRINT_HMAC_SECRET:-}
            DICTIONARY_DOCUMENT_RUNTIME_MODE: ${DICTIONARY_DOCUMENT_RUNTIME_MODE:-unavailable}
            DICTIONARY_DOCUMENT_SCANNER_HOST: ${DICTIONARY_DOCUMENT_SCANNER_HOST:-}
            DICTIONARY_DOCUMENT_SCANNER_PORT: ${DICTIONARY_DOCUMENT_SCANNER_PORT:-}
            DICTIONARY_DOCUMENT_SANDBOX_APPLICATION_ROOT: ${DICTIONARY_DOCUMENT_SANDBOX_APPLICATION_ROOT:-}
            DICTIONARY_DOCUMENT_SANDBOX_BWRAP_PATH: ${DICTIONARY_DOCUMENT_SANDBOX_BWRAP_PATH:-}
            DICTIONARY_DOCUMENT_SANDBOX_PARSER_ENTRY_PATH: ${DICTIONARY_DOCUMENT_SANDBOX_PARSER_ENTRY_PATH:-}
            DICTIONARY_DOCUMENT_STORAGE_MODE: ${DICTIONARY_DOCUMENT_STORAGE_MODE:-unavailable}
            DICTIONARY_DOCUMENT_STORAGE_ENDPOINT: ${DICTIONARY_DOCUMENT_STORAGE_ENDPOINT:-}
            DICTIONARY_DOCUMENT_STORAGE_REGION: ${DICTIONARY_DOCUMENT_STORAGE_REGION:-}
            DICTIONARY_DOCUMENT_STORAGE_BUCKET: ${DICTIONARY_DOCUMENT_STORAGE_BUCKET:-}
            DICTIONARY_DOCUMENT_STORAGE_FORCE_PATH_STYLE: ${DICTIONARY_DOCUMENT_STORAGE_FORCE_PATH_STYLE:-false}
            DICTIONARY_DOCUMENT_STORAGE_WORKER_ACCESS_KEY_ID: ${DICTIONARY_DOCUMENT_STORAGE_WORKER_ACCESS_KEY_ID:-}
            DICTIONARY_DOCUMENT_STORAGE_WORKER_SECRET_ACCESS_KEY: ${DICTIONARY_DOCUMENT_STORAGE_WORKER_SECRET_ACCESS_KEY:-}
            DICTIONARY_JOB_API_ENQUEUED_FORMATS: ${DICTIONARY_JOB_API_ENQUEUED_FORMATS:-}
            DICTIONARY_JOB_WORKER_PROCESSABLE_FORMATS: ${DICTIONARY_JOB_WORKER_PROCESSABLE_FORMATS:-}
            DICTIONARY_WORKER_CONCURRENCY: ${DICTIONARY_WORKER_CONCURRENCY:-2}
            DICTIONARY_WORKER_DRAIN_TIMEOUT_MS: ${DICTIONARY_WORKER_DRAIN_TIMEOUT_MS:-295000}
            DICTIONARY_WORKER_POLL_INTERVAL_MS: ${DICTIONARY_WORKER_POLL_INTERVAL_MS:-1000}
            DICTIONARY_WORKER_READINESS_TIMEOUT_MS: ${DICTIONARY_WORKER_READINESS_TIMEOUT_MS:-5000}
            RELEASE_SHA: ${RELEASE_SHA:?required}
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    'dist/infrastructure/worker/dictionary-worker-command.js',
                    'healthcheck',
                ]
            interval: 5s
            timeout: 6s
            retries: 24
            start_period: 10s
    account-purge-worker:
        <<: *worker-defaults
        image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable digest reference}
        command:
            [
                'node',
                'dist/infrastructure/worker/account-purge-command.js',
                'run',
            ]
        environment:
            APP_ENV: ${APP_ENV:?required}
            ACCOUNT_PURGE_DATABASE_URL: ${ACCOUNT_PURGE_DATABASE_URL:?required}
            ACCOUNT_PURGE_POLL_INTERVAL_MS: ${ACCOUNT_PURGE_POLL_INTERVAL_MS:-5000}
            ACCOUNT_PURGE_STORAGE_ACCESS_KEY_ID: ${ACCOUNT_PURGE_STORAGE_ACCESS_KEY_ID:-}
            ACCOUNT_PURGE_STORAGE_SECRET_ACCESS_KEY: ${ACCOUNT_PURGE_STORAGE_SECRET_ACCESS_KEY:-}
            DATABASE_MAX_CONNECTIONS: ${ACCOUNT_PURGE_DATABASE_MAX_CONNECTIONS:-2}
            DICTIONARY_DOCUMENT_STORAGE_MODE: ${DICTIONARY_DOCUMENT_STORAGE_MODE:-unavailable}
            DICTIONARY_DOCUMENT_STORAGE_ENDPOINT: ${DICTIONARY_DOCUMENT_STORAGE_ENDPOINT:-}
            DICTIONARY_DOCUMENT_STORAGE_REGION: ${DICTIONARY_DOCUMENT_STORAGE_REGION:-}
            DICTIONARY_DOCUMENT_STORAGE_BUCKET: ${DICTIONARY_DOCUMENT_STORAGE_BUCKET:-}
            DICTIONARY_DOCUMENT_STORAGE_FORCE_PATH_STYLE: ${DICTIONARY_DOCUMENT_STORAGE_FORCE_PATH_STYLE:-false}
            RELEASE_SHA: ${RELEASE_SHA:?required}
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    'dist/infrastructure/worker/account-purge-command.js',
                    'healthcheck',
                ]
            interval: 5s
            timeout: 6s
            retries: 24
            start_period: 10s

    web:
        <<: *app-defaults
        image: ${WEB_IMAGE:?WEB_IMAGE must be an immutable digest reference}
        environment:
            HOSTNAME: 0.0.0.0
            PORT: 3333
            RELEASE_SHA: ${RELEASE_SHA:?required}
            DICTIONARY_JOB_WEB_READABLE_FORMATS: ${DICTIONARY_JOB_WEB_READABLE_FORMATS:-}
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3333/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
                ]
            interval: 5s
            timeout: 3s
            retries: 24
            start_period: 10s
        networks:
            edge:
                aliases:
                    - ${DEPLOY_SLOT:?required}-web

    admin:
        <<: *app-defaults
        image: ${ADMIN_IMAGE:?ADMIN_IMAGE must be an immutable digest reference}
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--quiet',
                    '--spider',
                    'http://127.0.0.1:3001/healthz',
                ]
            interval: 5s
            timeout: 3s
            retries: 24
            start_period: 10s
        networks:
            edge:
                aliases:
                    - ${DEPLOY_SLOT:?required}-admin

networks:
    edge:
        external: true
        name: ${DEPLOY_PROJECT_PREFIX:?required}-edge
    data:
        external: true
        name: ${DEPLOY_PROJECT_PREFIX:?required}-data
