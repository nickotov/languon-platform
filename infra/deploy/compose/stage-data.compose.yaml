name: languon-stage-data

services:
    postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        restart: unless-stopped
        shm_size: 256mb
        environment:
            POSTGRES_DB: ${POSTGRES_DB:?required}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
            POSTGRES_USER: ${POSTGRES_USER:?required}
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
                ]
            interval: 5s
            timeout: 5s
            retries: 20
        volumes:
            - stage-postgres-data:/var/lib/postgresql/data
        networks:
            data:
                aliases: [stage-postgres]
        security_opt:
            - no-new-privileges:true

    redis:
        image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        restart: unless-stopped
        command:
            [
                'redis-server',
                '--appendonly',
                'yes',
                '--requirepass',
                '${REDIS_PASSWORD:?required}',
            ]
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG',
                ]
            interval: 5s
            timeout: 5s
            retries: 20
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
        volumes:
            - stage-redis-data:/data
        networks:
            data:
                aliases: [stage-redis]
        security_opt:
            - no-new-privileges:true

networks:
    data:
        external: true
        name: ${DEPLOY_PROJECT_PREFIX:-languon-stage}-data

volumes:
    stage-postgres-data:
    stage-redis-data:
