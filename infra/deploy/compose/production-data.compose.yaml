name: languon-production-data

services:
    postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        restart: unless-stopped
        shm_size: 512mb
        environment:
            POSTGRES_DB: ${POSTGRES_DB:?required}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
            POSTGRES_USER: ${POSTGRES_USER:?required}
        command:
            [
                'postgres',
                '-c',
                'listen_addresses=*',
                '-c',
                'max_connections=50',
                '-c',
                'ssl=on',
                '-c',
                'ssl_cert_file=/run/tls/server.crt',
                '-c',
                'ssl_key_file=/run/tls/server.key',
                '-c',
                'hba_file=/etc/postgresql/pg_hba.conf',
            ]
        ports:
            - ${DATA_PRIVATE_ADDRESS:?private address required}:5432:5432
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
                ]
            interval: 5s
            timeout: 5s
            retries: 20
        volumes:
            - production-postgres-data:/var/lib/postgresql/data
            - ${POSTGRES_HBA_PATH:?required}:/etc/postgresql/pg_hba.conf:ro
            - ${POSTGRES_TLS_CERTIFICATE_PATH:?required}:/run/tls/server.crt:ro
            - ${POSTGRES_TLS_PRIVATE_KEY_PATH:?required}:/run/tls/server.key:ro
        security_opt:
            - no-new-privileges:true

    redis:
        image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        restart: unless-stopped
        command:
            [
                'redis-server',
                '--appendonly',
                'yes',
                '--bind',
                '0.0.0.0',
                '--protected-mode',
                'yes',
                '--port',
                '0',
                '--tls-port',
                '6379',
                '--tls-cert-file',
                '/run/tls/server.crt',
                '--tls-key-file',
                '/run/tls/server.key',
                '--tls-ca-cert-file',
                '/run/tls/ca.crt',
                '--tls-auth-clients',
                'no',
                '--aclfile',
                '/run/secrets/redis.acl',
            ]
        ports:
            - ${DATA_PRIVATE_ADDRESS:?private address required}:6379:6379
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'redis-cli --tls --cacert /run/tls/ca.crt --user "$${REDIS_HEALTH_USER}" -a "$${REDIS_HEALTH_PASSWORD}" ping | grep PONG',
                ]
            interval: 5s
            timeout: 5s
            retries: 20
        environment:
            REDIS_HEALTH_PASSWORD: ${REDIS_HEALTH_PASSWORD:?required}
            REDIS_HEALTH_USER: ${REDIS_HEALTH_USER:?required}
        volumes:
            - production-redis-data:/data
            - ${DATA_TLS_CA_PATH:?required}:/run/tls/ca.crt:ro
            - ${REDIS_TLS_CERTIFICATE_PATH:?required}:/run/tls/server.crt:ro
            - ${REDIS_TLS_PRIVATE_KEY_PATH:?required}:/run/tls/server.key:ro
            - ${REDIS_ACL_PATH:?required}:/run/secrets/redis.acl:ro
        security_opt:
            - no-new-privileges:true

volumes:
    production-postgres-data:
    production-redis-data:
