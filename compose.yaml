name: languon

services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-languon}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-languon-local}
            POSTGRES_USER: ${POSTGRES_USER:-languon}
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        ports:
            - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data

    redis:
        image: redis:8-alpine
        command: ['redis-server', '--appendonly', 'yes']
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10
        ports:
            - '127.0.0.1:${REDIS_PORT:-6379}:6379'
        volumes:
            - redis-data:/data

    minio:
        image: minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
        command: ['server', '/data', '--console-address', ':9001']
        environment:
            MINIO_ROOT_USER: ${SPEECH_DEV_MINIO_ROOT_USER:-languon-speech-root}
            MINIO_ROOT_PASSWORD: ${SPEECH_DEV_MINIO_ROOT_PASSWORD:-languon-speech-root-local-only}
        ports:
            - '127.0.0.1:${SPEECH_DEV_MINIO_PORT:-9000}:9000'
            - '127.0.0.1:${SPEECH_DEV_MINIO_CONSOLE_PORT:-9001}:9001'
        volumes:
            - speech-minio-data:/data

    minio-init:
        image: minio/mc@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
        depends_on:
            minio:
                condition: service_started
        environment:
            MINIO_ROOT_USER: ${SPEECH_DEV_MINIO_ROOT_USER:-languon-speech-root}
            MINIO_ROOT_PASSWORD: ${SPEECH_DEV_MINIO_ROOT_PASSWORD:-languon-speech-root-local-only}
            SPEECH_ACCESS_KEY: ${SPEECH_DEV_MINIO_ACCESS_KEY:-languon-speech-api}
            SPEECH_SECRET_KEY: ${SPEECH_DEV_MINIO_SECRET_KEY:-languon-speech-api-local-only}
        entrypoint: ['/bin/sh', '-ec']
        command:
            - >-
                until /usr/bin/mc alias set speech-dev http://minio:9000
                "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done;
                /usr/bin/mc mb --ignore-existing speech-dev/languon-speech-dev;
                /usr/bin/mc version enable speech-dev/languon-speech-dev;
                /usr/bin/mc anonymous set none speech-dev/languon-speech-dev;
                /usr/bin/mc admin policy create speech-dev speech-api /policies/speech-api.json;
                /usr/bin/mc admin user add speech-dev "$${SPEECH_ACCESS_KEY}" "$${SPEECH_SECRET_KEY}";
                /usr/bin/mc admin policy attach speech-dev speech-api --user "$${SPEECH_ACCESS_KEY}";
        volumes:
            - ./infra/dev/speech-storage-policy.json:/policies/speech-api.json:ro

    migrate:
        profiles: ['apps']
        build:
            context: .
            dockerfile: infra/docker/dev.Dockerfile
        command: ['pnpm', 'db:migrate']
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            APP_ENV: development
            DATABASE_URL: postgres://${POSTGRES_USER:-languon}:${POSTGRES_PASSWORD:-languon-local}@postgres:5432/${POSTGRES_DB:-languon}

    backend:
        profiles: ['apps']
        build:
            context: .
            dockerfile: infra/docker/dev.Dockerfile
        command: ['pnpm', 'dev:backend']
        depends_on:
            migrate:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            minio-init:
                condition: service_completed_successfully
        environment:
            APP_ENV: development
            SPEECH_PLAYBACK_ENABLED: ${SPEECH_PLAYBACK_ENABLED:-false}
            SPEECH_GENERATION_ENABLED: ${SPEECH_GENERATION_ENABLED:-false}
            DICTIONARY_AUDIO_STORAGE: s3
            DICTIONARY_AUDIO_PROVIDER: fixture
            DICTIONARY_AUDIO_S3_ENDPOINT: http://minio:9000
            DICTIONARY_AUDIO_S3_BUCKET: languon-speech-dev
            DICTIONARY_AUDIO_S3_REGION: us-east-1
            DICTIONARY_AUDIO_S3_FORCE_PATH_STYLE: 'true'
            DICTIONARY_AUDIO_S3_ACCESS_KEY_ID: ${SPEECH_DEV_MINIO_ACCESS_KEY:-languon-speech-api}
            DICTIONARY_AUDIO_S3_SECRET_ACCESS_KEY: ${SPEECH_DEV_MINIO_SECRET_KEY:-languon-speech-api-local-only}
            AUTH_ALLOWED_ORIGINS: http://localhost:3333
            AUTH_CODE_HMAC_SECRET: development-only-code-secret-change-me-36a29d70c54e
            AUTH_JWT_SECRET: development-only-jwt-secret-change-me-9f87c82b4d31
            DICTIONARY_HMAC_SECRET: development-only-dictionary-secret-change-me-c9741f0e52ab
            AUTH_WEBAUTHN_RP_ID: localhost
            BACKEND_HOST: 0.0.0.0
            BACKEND_PORT: 4000
            DATABASE_URL: postgres://${POSTGRES_USER:-languon}:${POSTGRES_PASSWORD:-languon-local}@postgres:5432/${POSTGRES_DB:-languon}
            REDIS_URL: redis://redis:6379
        ports:
            - '${LANGUON_APP_BIND_HOST:-127.0.0.1}:4000:4000'

    web:
        profiles: ['apps']
        build:
            context: .
            dockerfile: infra/docker/dev.Dockerfile
        command: ['pnpm', 'dev:web:docker']
        environment:
            NEXT_PUBLIC_API_URL: http://localhost:4000
        ports:
            - '${LANGUON_APP_BIND_HOST:-127.0.0.1}:3333:3333'

    admin:
        profiles: ['apps']
        build:
            context: .
            dockerfile: infra/docker/dev.Dockerfile
        command: ['pnpm', 'dev:admin:docker']
        environment:
            ADMIN_API_PROXY_TARGET: http://backend:4000
        ports:
            - '${LANGUON_APP_BIND_HOST:-127.0.0.1}:3001:3001'

    mobile:
        profiles: ['apps']
        build:
            context: .
            dockerfile: infra/docker/dev.Dockerfile
        command: ['pnpm', 'dev:mobile:docker']
        ports:
            - '${LANGUON_APP_BIND_HOST:-127.0.0.1}:8081:8081'

volumes:
    postgres-data:
    redis-data:
    speech-minio-data:
