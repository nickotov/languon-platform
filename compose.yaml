name: languon

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-languon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-languon-local}
      POSTGRES_USER: ${POSTGRES_USER:-languon}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  backend:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: infra/docker/dev.Dockerfile
    command: ["pnpm", "dev:backend"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BACKEND_PORT: 4000
      DATABASE_URL: postgres://languon:languon-local@postgres:5432/languon
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"

  web:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: infra/docker/dev.Dockerfile
    command: ["pnpm", "dev:web"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"

  admin:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: infra/docker/dev.Dockerfile
    command: ["pnpm", "dev:admin"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3001:3001"

  mobile:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: infra/docker/dev.Dockerfile
    command: ["pnpm", "dev:mobile:docker"]
    ports:
      - "8081:8081"

volumes:
  postgres-data:
  redis-data:
