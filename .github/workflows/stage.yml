name: Stage verify, build, and deploy

on:
    workflow_dispatch:

permissions:
    contents: read
    packages: write
    attestations: write
    id-token: write

concurrency:
    group: deploy-stage
    cancel-in-progress: false

jobs:
    select-stage:
        name: Select current stage commit
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        outputs:
            source_sha: ${{ steps.ref.outputs.source_sha }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0
            - name: Fetch current stage branch
              run: git fetch --no-tags origin stage:refs/remotes/origin/stage
            - name: Resolve immutable stage head
              id: ref
              run: node scripts/release-ref.mjs stage origin/stage

    verify-build:
        name: Verify and build selected stage commit
        needs: select-stage
        uses: ./.github/workflows/reusable-verify-build.yml
        permissions:
            attestations: write
            contents: read
            id-token: write
            packages: write
        with:
            source_sha: ${{ needs.select-stage.outputs.source_sha }}
            identity: stage-${{ needs.select-stage.outputs.source_sha }}
            artifact_name: stage-manifest-${{ needs.select-stage.outputs.source_sha }}

    deploy:
        name: Deploy verified stage images
        needs: [select-stage, verify-build]
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        environment: staging
        permissions:
            contents: read
            actions: read
            attestations: read
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  ref: ${{ needs.select-stage.outputs.source_sha }}
            - name: Download manifest from this run
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: stage-manifest-${{ needs.select-stage.outputs.source_sha }}
                  path: .release
            - name: Reject substituted images
              env:
                  EXPECTED_SOURCE_SHA: ${{ needs.select-stage.outputs.source_sha }}
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
              run: >-
                  gh attestation verify .release/release-manifest.json --repo "$REPOSITORY" &&
                  node scripts/release-manifest.mjs validate
                  --input .release/release-manifest.json
                  --expected-source-sha "$EXPECTED_SOURCE_SHA"
            - name: Join private deployment network
              uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
              with:
                  oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
                  tags: tag:ci-stage
            - name: Configure pinned SSH identity
              env:
                  DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
                  DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
              run: |
                  install -m 700 -d "$HOME/.ssh"
                  printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
                  chmod 600 "$HOME/.ssh/id_ed25519"
                  printf '%s\n' "$DEPLOY_SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"
                  chmod 600 "$HOME/.ssh/known_hosts"
            - name: Copy deployment bundle and deploy exact manifest
              env:
                  DEPLOY_ACTOR: ${{ github.actor }}
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  SOURCE_SHA: ${{ needs.select-stage.outputs.source_sha }}
              run: |
                  remote_dir="/opt/languon/releases/$SOURCE_SHA"
                  target="$DEPLOY_USER@$DEPLOY_HOST"
                  ssh_options=(-i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
                  ssh "${ssh_options[@]}" "$target" "install -d '$remote_dir/infra/backup' '$remote_dir/infra/deploy' '$remote_dir/infra/nginx' '$remote_dir/scripts'"
                  scp "${ssh_options[@]}" -r infra/backup/. "$target:$remote_dir/infra/backup/"
                  scp "${ssh_options[@]}" infra/deploy/cli.mjs infra/deploy/admin-cli.mjs "$target:$remote_dir/infra/deploy/"
                  scp "${ssh_options[@]}" -r infra/deploy/lib infra/deploy/compose "$target:$remote_dir/infra/deploy/"
                  scp "${ssh_options[@]}" infra/nginx/nginx.conf infra/nginx/edge-entrypoint.sh "$target:$remote_dir/infra/nginx/"
                  scp "${ssh_options[@]}" scripts/deploy-release.mjs "$target:$remote_dir/scripts/"
                  scp "${ssh_options[@]}" .release/release-manifest.json "$target:$remote_dir/"
                  audit_tmp="$(mktemp)"
                  printf -v remote_command 'GITHUB_ACTOR=%q node %q --environment stage --manifest %q' "$DEPLOY_ACTOR" "$remote_dir/scripts/deploy-release.mjs" "$remote_dir/release-manifest.json"
                  ssh "${ssh_options[@]}" "$target" "$remote_command" > "$audit_tmp"
                  mv "$audit_tmp" .release/deployment-audit.json
            - name: Upload deployment audit
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: stage-deployment-audit-${{ github.run_id }}
                  path: .release/deployment-audit.json
                  if-no-files-found: warn
                  retention-days: 90
